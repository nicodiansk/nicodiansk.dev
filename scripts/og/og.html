<!doctype html>
<!-- Social preview card (1200×630). Rebuild public/og.jpg with: npm run og -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo Black';
        src: url('../../node_modules/@fontsource/archivo-black/files/archivo-black-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Mono';
        src: url('../../node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Mono';
        font-weight: 700;
        src: url('../../node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2') format('woff2');
      }
      :root {
        --ink: #070707;
        --paper: #f3e6c8;
        --pink: #ef4f7a;
        --pink-deep: #9e2448;
        --teal: #26b7aa;
        --teal-deep: #0f6b63;
        --mustard: #f6bd33;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
      }
      body {
        position: relative;
        font-family: 'Space Mono', monospace;
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        z-index: 5;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .left {
        position: absolute;
        left: 64px;
        top: 58px;
        width: 640px;
        z-index: 3;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .np {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 8px;
        background: var(--pink);
        color: var(--ink);
        font-family: 'Archivo Black';
        font-size: 22px;
        transform: rotate(-6deg);
        box-shadow: 4px 4px 0 var(--pink-deep);
      }
      .name {
        font-family: 'Archivo Black';
        text-transform: uppercase;
        font-size: 20px;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .eyebrow {
        margin-top: 38px;
        color: var(--teal);
        font-size: 17px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin-top: 14px;
        font-family: 'Archivo Black';
        text-transform: uppercase;
        font-weight: 400;
        font-size: 70px;
        line-height: 0.92;
        letter-spacing: -0.035em;
      }
      h1 span {
        display: block;
        white-space: nowrap;
      }
      .cream {
        color: var(--paper);
      }
      .teal {
        color: var(--teal);
      }
      .pink {
        color: var(--pink);
      }
      .cursor {
        color: var(--pink);
      }
      .role {
        margin-top: 26px;
        font-size: 19px;
        color: rgba(243, 230, 200, 0.85);
      }
      /* collage */
      .collage {
        position: absolute;
        right: 20px;
        top: 40px;
        width: 520px;
        height: 520px;
        z-index: 2;
      }
      .piece {
        position: absolute;
        filter: url(#rough);
      }
      .portrait {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 330px;
        height: 330px;
        transform: translate(-50%, -50%);
      }
      .portrait .ring {
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        background: var(--ink);
        filter: url(#rough);
      }
      .portrait img {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        filter: contrast(1.08) saturate(0.9);
      }
      .tag {
        position: absolute;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 7px 14px;
        border-radius: 3px;
        color: var(--ink);
      }
      .tape {
        position: absolute;
        left: -40px;
        right: -40px;
        bottom: 26px;
        transform: rotate(-1.6deg);
        background: var(--mustard);
        border-top: 3px solid var(--ink);
        border-bottom: 3px solid var(--ink);
        box-shadow: 0 7px 0 #9c6f06;
        padding: 12px 0;
        white-space: nowrap;
        font-family: 'Archivo Black';
        text-transform: uppercase;
        font-size: 25px;
        color: var(--ink);
        z-index: 4;
      }
      .tape b {
        color: var(--pink-deep);
        margin: 0 22px;
        font-weight: 400;
      }
      svg.doodle {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <filter id="rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="3" />
        <feDisplacementMap in="SourceGraphic" scale="16" />
      </filter>
    </svg>

    <div class="left">
      <div class="brand">
        <div class="np">NP</div>
        <div class="name">Nicholas<br />Previtali</div>
      </div>
      <p class="eyebrow">AI engineer · Bergamo, Italy</p>
      <h1>
        <span class="cream">Building AI</span>
        <span class="teal">that works</span>
        <span class="pink">in production.</span>
      </h1>
    </div>

    <div class="collage">
      <div class="piece" style="left: 18%; top: 0; width: 52%; height: 52%; border-radius: 50%; background: var(--teal)"></div>
      <div
        class="piece"
        style="left: 0; top: 38%; width: 40%; height: 44%; background: var(--teal-deep); clip-path: polygon(30% 0, 100% 40%, 70% 100%, 0 80%)"
      ></div>
      <div class="piece" style="right: 0; top: 8%; width: 72%; height: 70%; background: var(--paper); transform: rotate(8deg)"></div>
      <div
        class="piece"
        style="right: -6%; bottom: 4%; width: 62%; height: 44%; background: var(--pink); border-radius: 45% 55% 40% 60%; transform: rotate(-12deg)"
      ></div>
      <div class="portrait">
        <div class="ring"></div>
        <img src="../../public/images/nicholas.jpg" alt="" />
        <span class="tag" style="left: -26px; top: 22px; background: var(--mustard); transform: rotate(-12deg); box-shadow: 3px 3px 0 var(--ink)">Head of AI</span>
      </div>
      <svg class="doodle" viewBox="0 0 40 40" style="left: 4%; top: 2%; width: 50px; color: var(--pink); transform: rotate(12deg)">
        <path d="M6 9l29 22M33 6L9 35" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none" />
      </svg>
      <svg class="doodle" viewBox="0 0 40 40" style="right: 2%; top: 40%; width: 58px; color: var(--ink)">
        <g stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M20 3v34M5 11l30 18M5 29l30-18" /></g>
      </svg>
      <svg class="doodle" viewBox="0 0 40 40" style="left: 3%; top: 24%; width: 30px; color: var(--paper)">
        <path d="M20 2c1.5 10 4 14.5 18 18-14 3.5-16.5 8-18 18-1.5-10-4-14.5-18-18 14-3.5 16.5-8 18-18z" fill="currentColor" />
      </svg>
    </div>

    <div class="tape">
      Production RAG<b>✦</b>Multi-agent systems<b>✦</b>LLM evaluation<b>✦</b>LangGraph<b>✦</b>MCP<b>✦</b>Production RAG
    </div>
    <div class="grain"></div>
  </body>
</html>
